      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.1111" stop-color="#EC4899"/>
      <stop offset="0.2222" stop-color="#06B6D4"/>
      <stop offset="0.3333" stop-color="#7C3AED"/>
      <stop offset="0.4444" stop-color="#EC4899"/>
      <stop offset="0.5556" stop-color="#06B6D4"/>
      <stop offset="0.6667" stop-color="#7C3AED"/>
      <stop offset="0.7778" stop-color="#EC4899"/>
